name: Probe Mum V1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-probe-mum
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Repo indir
        uses: actions/checkout@v5

      - name: Mum probe calistir
        run: python3 probe_mum_v1.py

      - name: Sonucu kaydet
        run: |
          git config user.name "sol-toplayici-bot"
          git config user.email "sol-toplayici-bot@users.noreply.github.com"
          git add probe_mum
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
            exit 0
          fi
          git commit -m "probe mum $(date -u +%Y-%m-%d_%H%M)"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 10
          done
