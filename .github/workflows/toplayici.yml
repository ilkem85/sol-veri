name: Sol Toplayici V1

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-toplayici
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repo indir
        uses: actions/checkout@v4

      - name: Veri topla
        run: python3 sol_toplayici_v1.py

      - name: Veriyi kaydet
        run: |
          git config user.name "sol-toplayici-bot"
          git config user.email "sol-toplayici-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
            exit 0
          fi
          git commit -m "veri $(date -u +%Y-%m-%d_%H%M)"
          git pull --rebase
          git push
