name: Sol Toplayici V2

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sol-toplayici
  cancel-in-progress: false

jobs:
  topla:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Repo indir
        uses: actions/checkout@v5

      - name: Veri topla
        run: python3 sol_toplayici_v2.py

      - name: Veriyi kaydet
        run: |
          git config user.name "sol-toplayici-bot"
          git config user.email "sol-toplayici-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Degisiklik yok"
            exit 0
          fi
          git commit -m "veri2 $(date -u +%Y-%m-%d_%H%M)"
          for i in 1 2 3; do
            git pull --rebase && git push && break
            sleep 10
          done
